<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Los Gitanos Criminal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="shell"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let SESSION;
let SEM_FILTRE = null;   // id de semaine affichée, "" = toutes
let DATA = { semaines: {}, membres: {}, actionsDispo: {}, stock: {}, quotasCategorie: {}, transactions: {}, pochons: {}, arbre: {}, sale: {}, propre: {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderContent() {
  document.getElementById("content").innerHTML = `
    <h1>Dashboard</h1>
    <div class="sigil-rule"></div>
    <div id="eventBanner"></div>

    <div class="panel">
      <div class="panel-head"><h2>⏱️ Cooldown braquages</h2></div>
      <table>
        <thead><tr><th>Braquage</th><th>Statut</th><th>Se libère le</th></tr></thead>
        <tbody id="cooldownBody"></tbody>
      </table>
      <p class="small muted mt8">2 braquages maximum par semaine glissante : chacun se libère exactement 7 jours après son enregistrement (réussite ou échec).</p>
    </div>

    <div class="panel">
      <div class="row" style="max-width:340px;">
        <div><label class="l">Semaine affichée</label><select id="dSemaine" onchange="SEM_FILTRE = this.value; renderTout();"></select></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>🎯 Restant à faire cette semaine</h2></div>
      <table>
        <thead><tr><th>Membre</th><th>Actions restantes</th><th>Vente restante</th></tr></thead>
        <tbody id="restantBody"></tbody>
      </table>
    </div>

    <div class="grid cols-2" id="soldes" style="max-width:600px;margin:0 auto 18px;text-align:center;"></div>
    <div class="grid cols-3" id="catCards" style="margin-bottom:18px;"></div>

    <div class="panel">
      <div class="panel-head"><h2>🏆 Top 3 de la semaine</h2></div>
      <table>
        <thead><tr><th></th><th>Membre</th><th>Grade</th><th>Gagné</th></tr></thead>
        <tbody id="podiumBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Classement du groupe</h2></div>
      <table>
        <thead><tr><th>Membre</th><th>Grade</th><th>Actions réussies</th><th>Gagné</th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  `;
}

/* ---------- semaines ---------- */
function listeSemaines() {
  return entries(DATA.semaines).map(([id, s]) => ({ id, ...s })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}
function semaineActive() {
  const l = listeSemaines();
  return l.find(s => s.bloquee !== true) || l[0] || null;
}
function remplirSemaines() {
  const sel = document.getElementById("dSemaine");
  if (!sel) return;
  const l = listeSemaines(), active = semaineActive();
  if (SEM_FILTRE === null) SEM_FILTRE = active ? active.id : "";
  sel.innerHTML = l.map(s => `<option value="${s.id}">${esc(s.nom)}${s.bloquee ? " 🔒" : " 🟢"}${active && s.id === active.id ? " (active)" : ""}</option>`).join("") + '<option value="">— Toutes les semaines —</option>';
  sel.value = SEM_FILTRE;
}

/* ---------- cooldown braquages ---------- */
const BRAQUAGES = [["Fleeca", "🏦"], ["Armurerie", "🔫"]];
function renderCooldown() {
  const body = document.getElementById("cooldownBody");
  if (!body) return;
  const defs = entries(DATA.actionsDispo);
  const lignes = [];
  BRAQUAGES.forEach(([nom, emo]) => {
    const f = defs.find(([, a]) => a.nom === nom);
    if (f) lignes.push([emo + " " + nom, f[0], f[1]]);
    else lignes.push([emo + " " + nom, null, null]);
  });
  defs.filter(([, a]) => !BRAQUAGES.some(([n]) => n === a.nom) && cooldownConfig(a)).forEach(([id, a]) => lignes.push(["⏱️ " + a.nom, id, a]));

  body.innerHTML = lignes.map(([label, id, act]) => {
    if (!id) return `<tr><td>${label}</td><td colspan="2" class="muted small">action à créer dans Admin → Actions</td></tr>`;
    const et = cooldownEtat(id, act, DATA.arbre);
    const statut = et.libres > 0
      ? `<span style="color:var(--success);">✅ ${et.libres}/${et.max} disponible${et.libres > 1 ? "s" : ""}</span>`
      : `<span style="color:var(--danger);">⏳ Prochain dans ${fmtReste(et.prochain - Date.now())}</span>`;
    const libs = et.liberations.length
      ? et.liberations.map(t => `${new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} <span class="muted">(${fmtReste(t - Date.now()).replace(/ \d+s$/, "")})</span>`).join("<br>")
      : "—";
    return `<tr><td>${label}</td><td>${statut}</td><td style="font-size:12px;">${libs}</td></tr>`;
  }).join("");
}

/* ---------- calculs de la semaine affichée ---------- */
function actionsSelection() {
  const arbre = DATA.arbre || {};
  const semaines = SEM_FILTRE ? [SEM_FILTRE] : Object.keys(arbre);
  return semaines.flatMap(w => entries(arbre[w]).map(([id, a]) => ({ id, ...a })));
}
function fenetre() {
  if (!SEM_FILTRE) return [0, Infinity];
  const s = DATA.semaines[SEM_FILTRE] || {};
  return [s.createdAt || 0, s.closedAt || Infinity];
}
const gainDe = a => Number(a.gains_totaux) || (Number(a.argent_sale) || 0) + (Number(a.argent_propre) || 0);
const nb = n => (Number(n) || 0).toLocaleString("fr-FR");

function renderTout() {
  if (!document.getElementById("restantBody")) return;
  remplirSemaines();

  const [debut, fin] = fenetre();
  const reussites = actionsSelection().filter(a => a.resultat === "Réussite");
  const ventesTx = entries(DATA.transactions).map(([, t]) => t).filter(t => String(t.type || "").toLowerCase() === "vente" && (t.createdAt || 0) >= debut && (t.createdAt || 0) <= fin);
  const pochonsVentes = [];
  entries(DATA.pochons).forEach(([mid, lignes]) => entries(lignes).forEach(([, e]) => {
    if (e.type === "vente" && (e.createdAt || 0) >= debut && (e.createdAt || 0) <= fin) pochonsVentes.push({ ...e, membre_id: mid });
  }));

  /* soldes */
  const solde = v => entries(v).reduce((acc, [, l]) => acc + (l.type === "Sortie" ? -Number(l.montant || 0) : Number(l.montant || 0)), 0);
  document.getElementById("soldes").innerHTML = `
    <div class="card"><h3>🕶️ Argent sale</h3><div class="stat-num">${formatMoney(solde(DATA.sale))}</div></div>
    <div class="card"><h3>💵 Argent propre</h3><div class="stat-num">${formatMoney(solde(DATA.propre))}</div></div>`;

  /* cartes par catégorie d'action */
  const defs = entries(DATA.actionsDispo).filter(([, a]) => a.nom !== "Labo");
  const cartes = defs.map(([id, a]) => {
    const l = reussites.filter(x => x.action_id === id);
    return `<div class="card"><h3>${esc(a.nom)}</h3><div class="stat-num">${formatMoney(l.reduce((s, x) => s + gainDe(x), 0))}</div><div class="stat-sub">${l.length} réussite${l.length > 1 ? "s" : ""}</div></div>`;
  });
  cartes.push(`<div class="card"><h3>🔁 Ventes (Transactions)</h3><div class="stat-num">${formatMoney(ventesTx.reduce((s, t) => s + (Number(t.quantite) || 0) * (Number(t.prix) || 0), 0))}</div><div class="stat-sub">${ventesTx.length} vente${ventesTx.length > 1 ? "s" : ""}</div></div>`);
  cartes.push(`<div class="card"><h3>💊 Pochons</h3><div class="stat-num">${formatMoney(pochonsVentes.reduce((s, e) => s + (Number(e.total) || 0), 0))}</div><div class="stat-sub">${nb(pochonsVentes.reduce((s, e) => s + (Number(e.quantite) || 0), 0))} vendus</div></div>`);
  document.getElementById("catCards").innerHTML = cartes.join("");

  /* membres suivis */
  const membres = entries(DATA.membres).map(([id, m]) => ({ id, ...m })).filter(m => m.actif !== false && !m.invisible);

  /* restant à faire (quotas) — uniquement pour une semaine précise */
  const catIds = [...new Set(Object.values(DATA.actionsDispo).map(a => a.cat_variable).filter(Boolean))].filter(c => DATA.stock[c] && DATA.stock[c].nom !== "Labo");
  document.getElementById("restantBody").innerHTML = membres.length ? membres.map(m => {
    let ra = "—", rv = "—";
    if (SEM_FILTRE) {
      const quota = Number(m.quota) || 0;
      if (quota > 0) {
        const fait = reussites.filter(a => a.membre_id === m.id && !a.produit_drogue_id).reduce((s, a) => s + (Number(a.quantite) || 0), 0);
        ra = Math.max(0, quota - fait);
      }
      let qV = 0, fV = 0;
      catIds.forEach(c => {
        const q = Number((DATA.quotasCategorie[m.id] || {})[c]) || 0;
        if (!q) return;
        qV += q;
        const prods = new Set(Object.keys(DATA.stock[c].produits || {}));
        fV += reussites.filter(a => a.membre_id === m.id && prods.has(a.produit_drogue_id)).reduce((s, a) => s + (Number(a.quantite) || 0), 0)
            + ventesTx.filter(t => t.membre_id === m.id && (prods.has(t.produit_id) || t.catId === c)).reduce((s, t) => s + (Number(t.quantite) || 0), 0);
      });
      if (qV > 0) rv = Math.max(0, qV - fV);
    }
    return `<tr><td>${esc(m.prenom)} ${esc(m.nom || "")}</td><td class="mono">${ra}</td><td class="mono">${rv}</td></tr>`;
  }).join("") : '<tr class="empty-row"><td colspan="3">Aucun membre.</td></tr>';

  /* classement */
  const lignes = membres.map(m => {
    const mesActions = reussites.filter(a => a.membre_id === m.id);
    const gagne = mesActions.reduce((s, a) => s + gainDe(a), 0)
      + ventesTx.filter(t => t.membre_id === m.id).reduce((s, t) => s + (Number(t.quantite) || 0) * (Number(t.prix) || 0), 0)
      + pochonsVentes.filter(e => e.membre_id === m.id).reduce((s, e) => s + (Number(e.total) || 0), 0);
    return { m, nb: mesActions.length, gagne };
  }).sort((a, b) => b.gagne - a.gagne);

  document.getElementById("rankingBody").innerHTML = lignes.length
    ? lignes.map(l => `<tr><td>${esc(l.m.prenom)} ${esc(l.m.nom || "")}</td><td>${esc(l.m.grade || "")}</td><td class="mono">${l.nb}</td><td class="mono">${formatMoney(l.gagne)}</td></tr>`).join("")
    : '<tr class="empty-row"><td colspan="4">Aucune activité pour cette période.</td></tr>';

  const top = lignes.filter(l => l.gagne > 0).slice(0, 3), med = ["🥇", "🥈", "🥉"];
  document.getElementById("podiumBody").innerHTML = top.length
    ? top.map((l, i) => `<tr><td style="font-size:20px;">${med[i]}</td><td>${esc(l.m.prenom)} ${esc(l.m.nom || "")}</td><td>${esc(l.m.grade || "")}</td><td class="mono">${formatMoney(l.gagne)}</td></tr>`).join("")
    : '<tr class="empty-row"><td colspan="4">Aucune activité pour cette période.</td></tr>';
}

(async function () {
  await authReady;
  SESSION = await initShell("dashboard", "Dashboard");
  if (!SESSION) return;
  renderContent();

  const suivre = (chemin, cle, apres) => db.ref(chemin).on("value", snap => { DATA[cle] = snap.val() || {}; apres(); });
  suivre("semaines", "semaines", renderTout);
  suivre("membres", "membres", renderTout);
  suivre("actions_dispo", "actionsDispo", () => { renderTout(); renderCooldown(); });
  suivre("stock", "stock", renderTout);
  suivre("quotas_categorie", "quotasCategorie", renderTout);
  suivre("transactions", "transactions", renderTout);
  suivre("pochons", "pochons", renderTout);
  suivre("actions", "arbre", () => { renderTout(); renderCooldown(); });
  suivre("argent/sale", "sale", renderTout);
  suivre("argent/propre", "propre", renderTout);
  setInterval(renderCooldown, 1000);

  db.ref("events_drogue").on("value", snap => {
    const now = Date.now();
    const actif = entries(snap.val() || {}).map(([, e]) => e).find(e => now >= e.debut && now <= e.fin);
    const banner = document.getElementById("eventBanner");
    if (actif) {
      const fin = new Date(actif.fin).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      banner.innerHTML = `<div style="margin:16px 0; padding:18px 24px; border-radius:8px;
        background:linear-gradient(135deg,rgba(var(--accent-rgb),0.25),rgba(var(--accent-rgb),0.08));
        border:2px solid var(--accent); text-align:center; animation:pulse 2s infinite;">
        🎯 <strong style="color:var(--accent);font-size:1.2em;">EVENT EN COURS</strong>
        &nbsp;—&nbsp; Vente de Drogue à <strong style="color:var(--accent)">${actif.taux}%</strong>
        jusqu'à <strong style="color:var(--accent)">${fin}</strong>${actif.nom ? `&nbsp;·&nbsp; ${esc(actif.nom)}` : ""}
      </div>`;
    } else banner.innerHTML = "";
  });
})();
</script>
</body>
</html>
