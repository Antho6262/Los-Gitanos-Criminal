<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Gitanos Criminal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <img class="login-emblem" src="img/logo.png" alt="Los Gitanos Criminal">
  <div class="login-card fade-in">
    <div class="login-brand">LOS GITANOS CRIMINAL</div>
    <div class="login-sub">Accès membres</div>
    <div class="sigil-rule"></div>

    <div class="field">
      <label>Membre</label>
      <select id="selMembre" onchange="document.getElementById('priveWrap').style.display = this.value === '__prive__' ? 'block' : 'none';"><option value="">Chargement…</option></select>
    </div>
    <div class="field" id="priveWrap" style="display:none;">
      <label>Prénom du compte</label>
      <input type="text" id="inpPrive" placeholder="Prénom">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="inpPass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Se connecter</button>
    <div class="login-error" id="errMsg"></div>
    <div class="login-foot"><a href="#" onclick="toggleOublie(event)" style="color:var(--gold)">Mot de passe oublié ?</a></div>
    <div id="oublieWrap" style="display:none;margin-top:10px;">
      <p class="small muted">Une demande sera envoyée à un admin, qui réinitialisera ton mot de passe.</p>
      <button class="btn btn-gold" style="width:100%;" onclick="envoyerDemandeOubli()">Envoyer la demande</button>
      <div class="small" id="oublieMsg" style="margin-top:6px;"></div>
    </div>
    <div class="login-foot" id="setupLink" style="display:none;">Première installation ? <a href="setup.html" style="color:var(--gold)">Initialiser le site</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
let MEMBRES = {};

async function chargerMembres() {
  const sel = document.getElementById("selMembre");
  try {
    const snap = await db.ref("membres").once("value");
    const data = snap.val() || {};
    MEMBRES = data;
    sel.innerHTML = '<option value="">— Sélectionner —</option>';
    entries(data).forEach(([id, m]) => {
      if (m.actif === false || m.invisible) return;
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = m.prenom + (m.nom ? " " + m.nom : "");
      sel.appendChild(opt);
    });
    // Comptes invisibles : connexion via index.html#prive (ils n'apparaissent pas dans la liste)
    if (location.hash === "#prive") {
      const opt = document.createElement("option");
      opt.value = "__prive__"; opt.textContent = "🔒 Compte privé…";
      sel.appendChild(opt);
    }
    if (Object.keys(data).length === 0) {
      sel.innerHTML = '<option value="">Aucun membre — lancez l\'initialisation</option>';
      document.getElementById("setupLink").style.display = "block";
    }
  } catch (e) {
    sel.innerHTML = '<option value="">Erreur de connexion Firebase</option>';
    document.getElementById("errMsg").textContent = "Vérifiez la config Firebase (js/firebase-config.js).";
  }
}

function doLogin() {
  let id = document.getElementById("selMembre").value;
  const pass = document.getElementById("inpPass").value.trim();
  const errEl = document.getElementById("errMsg");
  errEl.textContent = "";
  if (id === "__prive__") {
    const p = document.getElementById("inpPrive").value.trim().toLowerCase();
    const trouve = entries(MEMBRES).find(([, x]) => x.invisible && (x.prenom || "").toLowerCase() === p);
    id = trouve ? trouve[0] : "";
  }
  if (!id) { errEl.textContent = "Sélectionnez un membre."; return; }
  const m = MEMBRES[id];
  if (!m || m.mot_de_passe !== pass) {
    errEl.textContent = "Mot de passe incorrect.";
    return;
  }
  if (m.actif === false) {
    errEl.textContent = "Compte désactivé.";
    return;
  }
  authReady.then(user => {
    return db.ref("sessions/" + user.uid).set(id);
  }).then(() => {
    setSession({ id, prenom: m.prenom, nom: m.nom || "", grade: m.grade, role: m.role || "membre" });
    window.location.href = "pages/dashboard.html";
  }).catch(() => {
    errEl.textContent = "Erreur de connexion.";
  });
}

function toggleOublie(e) {
  e.preventDefault();
  const wrap = document.getElementById("oublieWrap");
  wrap.style.display = wrap.style.display === "none" ? "block" : "none";
}

async function envoyerDemandeOubli() {
  const id = document.getElementById("selMembre").value;
  const msg = document.getElementById("oublieMsg");
  if (!id) { msg.textContent = "Sélectionne d'abord ton membre dans la liste ci-dessus."; return; }
  const m = MEMBRES[id];
  await db.ref("reset_requests/" + id).set({
    membre_id: id, prenom: m.prenom, nom: m.nom || "", date: new Date().toISOString().slice(0, 10), createdAt: Date.now()
  });
  msg.textContent = "Demande envoyée. Un admin va réinitialiser ton mot de passe.";
}

document.getElementById("inpPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
chargerMembres();
</script>
</body>
</html>
